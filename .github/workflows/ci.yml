name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10.9"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy src
      - name: pytest
        run: uv run pytest -q
      - name: schema/wire-schema alignment
        run: uv run python -c "import json; json.load(open('schemas/assessment.schema.json')); json.load(open('schemas/assessment.wire.schema.json'))"
